[project]
name = "sisec"
version = "1.0.0"
description = "SiSEC 2018 explorer 的計算後端：統計、張量分割與 FastAPI"
requires-python = ">=3.12"
dependencies = ["numpy", "fastapi", "uvicorn"]

[dependency-groups]
dev = ["pytest", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sisec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
