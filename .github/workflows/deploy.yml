# 推到 master 時先跑後端測試，再 npm run build，把 dist/ 部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run pytest -q
        working-directory: backend

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 沒設定後端網址就不部署：否則會上線一個連不到計算伺服器的頁面
      - name: 確認已設定 API_URL
        run: test -n "$VITE_API_URL" || { echo "::error::repo 變數 API_URL 未設定"; exit 1; }
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - run: npm run build
        env:
          # 計算後端的網址（repo 變數）；前端打包時寫進程式
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
